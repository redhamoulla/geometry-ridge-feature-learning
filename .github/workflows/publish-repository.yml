name: publish-repository

on:
  push:
    branches: [main]
    paths:
      - '.publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/bundle-*.b64 | base64 --decode > /tmp/compactrepo.tar.gz
          echo '5b732b947729b7c9d300ce99c4c25b3460e9136d4dcbbdfeeae6bc73c390d4f2  /tmp/compactrepo.tar.gz' | sha256sum -c -
      - name: Publish structured repository
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .artifacts
          rm -f .github/workflows/bootstrap-repository.yml
          tar -xzf /tmp/compactrepo.tar.gz -C .
          rm -rf .publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
