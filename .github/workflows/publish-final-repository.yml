name: publish-final-repository

on:
  push:
    branches: [main]
    paths:
      - '.publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct and validate repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/bundle-*.b64 | base64 --decode > /tmp/repository.tar.gz
          echo 'd95fed9a23d4f0746c29654df67b21adaa1c1992399117091cf3e7fbd0689bf9  /tmp/repository.tar.gz' | sha256sum -c -
      - name: Publish structured repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.publish' -exec rm -rf {} +
          tar -xzf /tmp/repository.tar.gz -C .
          rm -rf .publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
