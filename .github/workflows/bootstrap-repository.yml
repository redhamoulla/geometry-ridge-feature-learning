name: publish-repository

on:
  push:
    branches: [main]
    paths:
      - '.publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate repository bundle
        shell: bash
        run: |
          set -euo pipefail
          echo '3ac996114cd2a4c57f6d980699995fa7cf4664e3a9cb60ac156b313ff524031a  .publish/repository.tar.gz' | sha256sum -c -
      - name: Publish structured repository
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.publish' -exec rm -rf {} +
          tar -xzf .publish/repository.tar.gz -C .
          rm -rf .publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
