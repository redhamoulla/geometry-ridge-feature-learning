name: publish-repository

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-repository.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download and validate repository bundle
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 5 --retry-delay 2 \
            'https://drive.google.com/uc?export=download&id=17f5pUj2J02dMFIL-R139wvYjY6gvX9sp' \
            --output /tmp/repository.tar.xz
          echo 'dc9e6dcf993a337abf7da3a613bfdd42fc5075522c335638d359da4c5acd944f  /tmp/repository.tar.xz' | sha256sum -c -

      - name: Publish structured repository on main
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/existing-workflows
          cp -a .github/workflows/. /tmp/existing-workflows/
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf {} +
          tar -xJf /tmp/repository.tar.xz -C .
          rm -rf .github/workflows
          mkdir -p .github/workflows
          cp -a /tmp/existing-workflows/. .github/workflows/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
