name: bootstrap-repository

on:
  push:
    branches: [main]
    paths: ['.artifacts/**']

permissions:
  contents: write

jobs:
  bootstrap:
    if: ${{ hashFiles('.artifacts/*.b64') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconstruct repository files and paper artifacts
        run: |
          cat .artifacts/repository-files-*.b64 | base64 --decode > /tmp/repository-files.tar.gz
          grep '/tmp/repository-files.tar.gz' .artifacts/SHA256SUMS | sha256sum -c -
          tar -xzf /tmp/repository-files.tar.gz
          cat .artifacts/paper-pdf-*.b64 | base64 --decode > paper/conditional_geometric_register_of_observations_v7_en.pdf
          cat .artifacts/paper-sources-*.b64 | base64 --decode > paper/conditional_geometric_register_of_observations_v7_en_sources.zip
          grep -v '/tmp/repository-files.tar.gz' .artifacts/SHA256SUMS | sha256sum -c -
          rm -rf .artifacts .github/workflows/bootstrap-repository.yml
      - name: Commit structured repository
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push
