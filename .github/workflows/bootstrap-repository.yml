name: publish-repository

on:
  push:
    branches: [main]
    paths:
      - '.publish/repository.tar.gz'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-repository
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate uploaded repository bundle
        shell: bash
        run: |
          set -euo pipefail
          test -s .publish/repository.tar.gz
          tar -tzf .publish/repository.tar.gz > /tmp/repository-files.txt
          grep -Eq '(^|\./)README\.md$' /tmp/repository-files.txt
          grep -Eq '(^|\./)paper/' /tmp/repository-files.txt
          grep -Eq '(^|\./)experiments/' /tmp/repository-files.txt

      - name: Publish structured repository on main
        shell: bash
        run: |
          set -euo pipefail
          cp .publish/repository.tar.gz /tmp/repository.tar.gz
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.publish' -exec rm -rf {} +
          tar -xzf /tmp/repository.tar.gz -C .
          rm -rf .publish
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
