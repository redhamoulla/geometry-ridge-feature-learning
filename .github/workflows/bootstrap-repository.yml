name: publish-repository

on:
  push:
    branches: [main]
    paths:
      - '.publish/READY'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct repository bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .publish/bundle-* | base64 --decode > /tmp/repository.tar.gz
          echo '9cb90a64fe3940531d87a8053a1fb56ef1f1ff7e6aaef4afac76f960f0f2f313  /tmp/repository.tar.gz' | sha256sum -c -
          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.publish' -exec rm -rf {} +
          tar -xzf /tmp/repository.tar.gz -C .
          rm -rf .publish .artifacts

      - name: Expand the English paper sources
        shell: bash
        run: |
          set -euo pipefail
          rm -rf paper/src /tmp/paper-source
          mkdir -p paper/src /tmp/paper-source
          unzip -q paper/conditional_geometric_register_of_observations_v7_en_sources.zip -d /tmp/paper-source
          cp -a /tmp/paper-source/conditional_geometric_register_of_observations_v7_en_sources/. paper/src/

      - name: Compile the paper
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          working_directory: paper/src

      - name: Commit the published repository
        shell: bash
        run: |
          set -euo pipefail
          cp paper/src/main.pdf paper/conditional_geometric_register_of_observations_v7_en.pdf
          rm -f .github/workflows/bootstrap-repository.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'build: publish paper and reproducible simulations'
          git push origin HEAD:main
