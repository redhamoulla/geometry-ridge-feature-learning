[build-system]
requires=['setuptools>=68']
build-backend='setuptools.build_meta'
[project]
name='conditional-geometric-register'
version='0.1.0'
description='Geometric per-observation diagnostics and robustness experiments'
requires-python='>=3.10'
dependencies=['numpy>=1.26','scipy>=1.11','pandas>=2.1','scikit-learn>=1.4','torch>=2.2']
[project.optional-dependencies]
dev=['pytest>=8']
[tool.setuptools.packages.find]
where=['src']
[tool.pytest.ini_options]
pythonpath=['src']
testpaths=['tests']
