[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "conditional-geometric-register-experiments"
version = "0.1.0"
description = "Reproducible experiments for the conditional geometric register of observations"
requires-python = ">=3.10"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
